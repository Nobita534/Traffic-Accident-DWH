version: 2

models:
  - name: int_traffic_accidents
    description: >
      Intermediate model that applies business transformation logic,
      derives analytical attributes, and prepares data for dimensional modeling.

    columns:

      - name: intersection_related_i
        description: >
          Nullable Boolean flag derived from the raw intersection indicator.
          Y maps to true, N maps to false, and missing or unexpected values remain
          NULL so that unknown intersection status is not misclassified as false.

      - name: crash_severity_weight
        description: >
          Crash-level severity weight used for the 12-3-1 Severity Index.
          Fatal crashes receive 12, non-fatal injury crashes receive 3,
          and property-damage-only or no-injury crashes receive 1.

      - name: datekey
        description: >
          Surrogate date key in YYYYMMDD format used to join the Date Dimension.